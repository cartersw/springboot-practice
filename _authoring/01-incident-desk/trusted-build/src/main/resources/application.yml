server:
  address: 127.0.0.1
  port: 8081
spring:
  application:
    name: incident-desk
  datasource:
    url: jdbc:h2:mem:incident_desk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      accept-float-as-int: false
logging:
  level:
    root: WARN
    dev.practice: INFO
